[package]
name = "sglang-server"
description = "Sglang server in rust"
version.workspace = true
edition.workspace = true
license.workspace = true

# Consumed by python/setup.py: registers this crate as a PyO3 extension module.
[package.metadata.sglang]
python-module = "sglang.srt.server._core"
# Always build optimized, even for an editable install.
debug = false

[lib]
name = "sglang_server"
# cdylib: the pyo3 module imported by the (embedded) Python scheduler process.
# rlib:   so optional standalone bins / integration tests can link the core.
crate-type = ["cdylib", "rlib"]

[dependencies]
async-stream = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

axum = { version = "0.8.9", features = ["json", "tokio"] }
core_affinity = "0.8"
# the dynamo-tokenizers is deps on hf-hub, should bump version together.
dynamo-tokenizers = "1.7.0"
# Keep the HTTP adapter on Dynamo's public OpenAI types, renderer, and parsers.
# `dynamo-llm` stays excluded because it pulls the full runtime just to reuse
# small service helpers.
dynamo-parsers = "7.0.1"
dynamo-protocols = "5.1.0"
dynamo-renderer = "5.0.0"
flume = "0.12.0"
# SIMD byte-pair encoder for the tokenizer pool — see the `gigatoken` feature
# below for why the dependency is commented out rather than optional.
#
# gigatoken = { git = "https://github.com/marcelroed/gigatoken", rev = "<rev>", optional = true }
# Safe POD slice casts (feature buffers viewed as bytes for the shm copy).
bytemuck = "1"
itertools = "0.14"
hf-hub = { version = "0.4", default-features = false }
# POSIX shm for the MM feature fan-out (`mm::ShmSegment`).
libc = "0.2"
# Same major as the workspace pyo3: the zero-copy MM drain (`take_mm`) moves
# Rust vectors into numpy arrays.
numpy = "0.29.0"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
# Pinned EXACTLY: this crate's accepted grammar defines the
# "anything Rust admits, Python can compile" invariant in `message::sampling`.
# A minor bump can widen it and silently reopen a scheduler-killing hole.
regex-syntax = "=0.8.11"
# The pure-Rust core of the MM pipeline. `default-features = false` drops the
# pyo3 bindings so it links as a plain rlib; renamed so `use sglang_mm::…` reads
# naturally while the crate keeps its own artifact name in the shared target/.
sglang_mm = { package = "sglang-mm", path = "../sglang-mm", default-features = false }

[features]
default = []
# `--tokenizer-backend=gigatoken`: swap the encode pool's backend for gigatoken
# (`src/tokenizer/gigatoken.rs`). Tokenize is 93-97% of this side's latency at
# prompts of 16K tokens and up, and gigatoken encodes ~100x faster per token.
#
# The dependency above is COMMENTED OUT, not `optional = true`, because cargo
# parses an optional dependency's manifest during resolution even when the
# feature is off — so merely declaring it fails the build for everyone. As of
# gigatoken fac0114b3 three things block it as a stable-Rust dependency:
#   1. it needs nightly (`#![feature(portable_simd)]`), used only by its
#      SentencePiece path — which this integration refuses anyway;
#   2. its manifest sets `[profile.profiling] rustflags`, which a stable cargo
#      rejects outright (unstable `profile-rustflags`) — this is the one that
#      breaks resolution;
#   3. its pyo3/numpy deps are not optional and enable `abi3-py310`, which cargo
#      would unify into this crate's own pyo3 — the same hazard `sglang_mm`
#      documents below, which is why that one is consumed with
#      `default-features = false`.
# It is also not published to crates.io. To try the backend, uncomment the
# dependency, point it at a checkout with those three fixed, and build with
# `--features gigatoken`.
#
# Independent of all that, the correctness-critical half — affix derivation and
# the parity gate in `tokenizer::derive_affixes`, plus the backend dispatch in
# `build_text_tokenizer` — is compiled and tested in every build.
gigatoken = []

[dev-dependencies]
# `Router::oneshot` for handler-level router tests.
tower = { version = "0.5", features = ["util"] }
